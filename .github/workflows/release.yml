# Windows release pipeline for vectile (Wails v3).
#
# Push a stable `vX.Y.Z` tag → builds the Windows binary + NSIS installer,
# attaches both to a GitHub Release with checksums, and deletes the tag again
# if the build fails.
#
# Ported from the wails3-release skill; adapted for vectile:
#   - Windows only for now (the vendored llama-go only has Windows/MinGW
#     static archives, so Linux/macOS can't link yet — re-add those jobs once
#     per-OS archives exist).
#   - CGO_ENABLED=1 + MinGW (vectile links llama.cpp), not CGO=0.
#   - The 5 MinGW runtime DLLs ship beside the exe and in the installer
#     (committed under build/windows/runtime).
#   - The version is injected into main.go's `Version` var (with the `v`).

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate stable release tag
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build-windows-amd64:
    runs-on: windows-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ChocolateyInstall\bin",
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              $env:PATH = "$candidate;$env:PATH"
            }
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw "makensis not found after NSIS installation"
          }
          Write-Host "Using makensis at $((Get-Command makensis).Source)"

      - name: Install MinGW-w64 (for the CGO llama.cpp link)
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # Find the mingw bin dir wherever choco put it (versioned path varies).
          $gcc = Get-ChildItem "C:\ProgramData\chocolatey\lib\mingw" -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe not found after MinGW installation" }
          $mingwBin = $gcc.DirectoryName
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          $env:PATH = "$mingwBin;$env:PATH"
          Write-Host "Using gcc at $((Get-Command gcc).Source)"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: go mod tidy
        run: go mod tidy

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        shell: bash
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Inject version into Windows metadata
        shell: bash
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          sed -i "s/\"ProductVersion\": \"[^\"]*\"/\"ProductVersion\": \"${VERSION}\"/" build/windows/info.json
          sed -i "s/\"file_version\": \"[^\"]*\"/\"file_version\": \"${VERSION}\"/" build/windows/info.json
          sed -i "/assemblyIdentity/s/version=\"[^\"]*\"/version=\"${VERSION}\"/" build/windows/wails.exe.manifest
          sed -i "s/!define INFO_PRODUCTVERSION \"[^\"]*\"/!define INFO_PRODUCTVERSION \"${VERSION}\"/" build/windows/nsis/wails_tools.nsh

      - name: Generate .syso resource
        working-directory: build
        shell: bash
        run: wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso

      - name: Build Windows binary
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          LIBRARY_PATH: ${{ github.workspace }}/third_party/llama-go
          C_INCLUDE_PATH: ${{ github.workspace }}/third_party/llama-go
        shell: bash
        run: |
          mkdir -p build/bin
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.Version=v${{ needs.validate-tag.outputs.version }}" -o build/bin/vectile-windows-amd64.exe
          rm -f wails_windows_amd64.syso

      - name: Copy MinGW runtime DLLs beside the exe
        shell: pwsh
        run: |
          foreach ($dll in @("libgcc_s_seh-1.dll","libgomp-1.dll","libstdc++-6.dll","libwinpthread-1.dll","libdl.dll")) {
            Copy-Item (Join-Path "build\windows\runtime" $dll) (Join-Path "build\bin" $dll) -Force
          }

      - name: Generate WebView2 bootstrapper
        shell: bash
        run: wails3 generate webview2bootstrapper -dir "build/windows/nsis"

      - name: Build NSIS installer
        shell: cmd
        run: makensis -DARG_WAILS_AMD64_BINARY=..\..\bin\vectile-windows-amd64.exe build\windows\nsis\project.nsi

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\bin\vectile-windows-amd64.exe dist\vectile-windows-amd64.exe
          $installer = Get-ChildItem bin\*installer*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found in bin" }
          Copy-Item $installer.FullName dist\vectile-windows-amd64-installer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-amd64
          path: dist/*

  cleanup-tag-on-failure:
    runs-on: ubuntu-latest
    needs:
      - build-windows-amd64
    if: always() && needs.build-windows-amd64.result == 'failure'
    permissions:
      contents: write
    steps:
      - name: Delete tag
        run: |
          git -c "http.extraHeader=Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            push origin --delete "${{ github.ref_name }}" || true

  release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-windows-amd64
    if: needs.validate-tag.outputs.is_stable == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURR_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..${CURR_TAG}"; else RANGE="${CURR_TAG}"; fi

          # ── Download table + first-run notes ─────────────────────────────
          {
            echo '## Download'
            echo ''
            echo '| Platform | Link | Note |'
            echo '|---|---|---|'
            echo "| Windows (installer) | [vectile-windows-amd64-installer.exe](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/vectile-windows-amd64-installer.exe) | ⚠️ SmartScreen will block it - see First-Run Notes below |"
            echo "| Windows (portable)  | [vectile-windows-amd64.exe](https://github.com/${{ github.repository }}/releases/download/${CURR_TAG}/vectile-windows-amd64.exe) | |"
            echo ''
            echo 'SHA-256 checksums are in \`SHA256SUMS.txt\` attached below.'
            echo ''
            echo '## First-Run Notes'
            echo ''
            echo 'vectile is unsigned, so first launch may warn you - it'"'"'s safe and open source.'
            echo ''
            echo '- **Windows:** SmartScreen -> **More info** -> **Run anyway** (or unblock the `.exe` in Properties).'
            echo ''
          } > commit_log.md

          # ── Changelog (PRs + commits + contributors) ──────────────────────
          COMMITS_FILE=$(mktemp)
          USERS_FILE=$(mktemp)
          PR_FILE=$(mktemp)
          PR_FOUND=false
          REPO="${{ github.repository }}"

          while IFS=$'\t' read -r HASH MSG; do
            [ -z "$HASH" ] && continue
            COMMIT_JSON=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/commits/${HASH}" 2>/dev/null || echo "{}")
            GH_LOGIN=$(echo "$COMMIT_JSON" | jq -r '.author.login // empty' 2>/dev/null || echo "")
            PR_JSON=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/commits/${HASH}/pulls" 2>/dev/null || echo "[]")
            PR_LINE=$(echo "$PR_JSON" | jq -r --arg repo "$REPO" --arg author "${GH_LOGIN}" '.[0] | select(. != null) | "- \(.title) [#\(.number)](https://github.com/\($repo)/pull/\(.number))" + (if $author != "" then " - @\($author)" else "" end)' 2>/dev/null || echo "")
            if [ -n "$PR_LINE" ]; then echo "$PR_LINE" >> "$PR_FILE"; PR_FOUND=true; fi
            if [ -n "$GH_LOGIN" ]; then
              echo "$GH_LOGIN" >> "$USERS_FILE"
              echo "- ${MSG} - @${GH_LOGIN}" >> "$COMMITS_FILE"
            else
              echo "- ${MSG}" >> "$COMMITS_FILE"
            fi
          done < <(git log "$RANGE" --pretty=format:"%H%x09%s" --no-merges)

          echo "## What's Changed" >> commit_log.md
          echo "" >> commit_log.md
          if [ "$PR_FOUND" = true ] && [ -s "$PR_FILE" ]; then
            echo "### Pull Requests" >> commit_log.md
            echo "" >> commit_log.md
            sort -u "$PR_FILE" >> commit_log.md
            echo "" >> commit_log.md
          fi
          if [ -s "$COMMITS_FILE" ]; then
            echo "### Commits" >> commit_log.md
            echo "" >> commit_log.md
            cat "$COMMITS_FILE" >> commit_log.md
            echo "" >> commit_log.md
          fi
          if [ -s "$USERS_FILE" ]; then
            echo "### Contributors" >> commit_log.md
            echo "" >> commit_log.md
            echo "<table><tr>" >> commit_log.md
            for USER in $(sort -u "$USERS_FILE"); do
              printf '  <td align="center"><a href="https://github.com/%s"><img src="https://github.com/%s.png?size=72" width="72" height="72" style="border-radius:50%%" /><br /><b>@%s</b></a></td>\n' "$USER" "$USER" "$USER" >> commit_log.md
            done
            echo "</tr></table>" >> commit_log.md
            echo "" >> commit_log.md
          fi

          rm -f "$COMMITS_FILE" "$USERS_FILE" "$PR_FILE"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          test -f artifacts/vectile-windows-amd64-installer.exe
          test -f artifacts/vectile-windows-amd64.exe

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum vectile-windows-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body_path: commit_log.md
          files: artifacts/*
